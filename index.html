<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chấm công">
<meta name="robots" content="noindex">
<title>Chấm công</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#14202b;--mut:#6b7885;--line:#e1e7ed;--pri:#0f766e;--ok:#16a34a;--no:#dc2626;--warn:#b45309;--chip:#eef2f6;--okbg:#dcfce7;--warnbg:#fef3c7;--nobg:#fee2e2}
@media(prefers-color-scheme:dark){:root{--bg:#0f151b;--card:#18222b;--ink:#e8eef3;--mut:#93a1ae;--line:#29353f;--chip:#233039;--okbg:#14391f;--warnbg:#3d2e0a;--nobg:#401a1a;--pri:#2dd4bf}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.muted{color:var(--mut)}.c{text-align:center}.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px;display:block;width:100%;text-align:left}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no{background:var(--no);border-color:var(--no);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;margin-top:10px}.btns .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);border-radius:20px;padding:2px 10px;font-size:13px}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.no{background:var(--nobg);color:var(--no)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;flex:none}
h1,h2,h3{margin:0}
/* kiosk */
.kiosk{min-height:100vh;display:flex;flex-direction:column;padding:16px;max-width:1100px;margin:0 auto}
.khead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.khead h1{font-size:22px}
.clock{text-align:right}.clock b{font-size:34px;display:block;line-height:1}.clock span{color:var(--mut);font-size:14px}
.photobar{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-weight:600;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;flex:1;align-content:start}
.emp{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:150px}
.emp:active{transform:scale(.98)}
.emp .av{width:60px;height:60px;font-size:26px}
.emp b{font-size:19px}.emp small{color:var(--mut);font-size:13px}
.emp.in{border-color:var(--ok)}
.st{font-weight:700;font-size:13px;border-radius:20px;padding:2px 10px;background:var(--chip)}.st.in{background:var(--okbg);color:var(--ok)}
.kfoot{margin-top:14px;text-align:center}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.pin{text-align:center}.pin h2{font-size:22px}.pin .sub{margin:2px 0 10px;color:var(--mut)}
.dots{display:flex;gap:14px;justify-content:center;margin:10px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--mut)}.dots i.on{background:var(--pri);border-color:var(--pri)}
.perr{min-height:22px;color:var(--no);font-weight:600}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:6px auto 0}
.keys button{height:66px;font-size:26px;font-weight:600;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.keys button.ghost{background:transparent;font-size:16px}
.big{width:100%;min-height:84px;font-size:26px;border-radius:18px;border:0;font-weight:800;color:#fff;margin:10px 0}
.big.ok{background:var(--ok)}.big.no{background:var(--no)}.big:disabled{opacity:.6}
.done{text-align:center;padding:10px 0}.done .tick{font-size:70px;line-height:1}
/* mgr */
.mgr{max-width:900px;margin:0 auto;min-height:100vh;padding:0 14px 90px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:8px}
.top h1{font-size:18px}.top small{display:block;color:var(--mut);font-size:12px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.pill.on{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;color:var(--mut);position:relative}
.nav button span{display:block;font-size:22px}
.nav button.on{color:var(--pri);font-weight:700}
.badge{position:absolute;top:2px;left:55%;background:var(--no);color:#fff;border-radius:10px;font-size:11px;min-width:18px;padding:0 5px;font-weight:700}
.sec{font-weight:700;margin:14px 0 6px}
.subhead{display:flex;align-items:center;gap:8px;margin:6px 0 10px}.subhead h2{font-size:20px;flex:1}
.nm{position:sticky;left:0;background:var(--bg);font-weight:600;min-width:74px;max-width:90px;font-size:14px;padding:4px 6px 4px 0;z-index:1}
.wk{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px}
.wk table{border-collapse:separate;border-spacing:3px;width:100%}
.wk th{font-size:12px;color:var(--mut);font-weight:600;padding:2px}.wk th.today{color:var(--pri)}
.wk td.nm{background:var(--card)}
.cell{width:100%;min-width:66px;height:50px;border-radius:10px;border:1px dashed var(--line);background:transparent;font-size:12px;font-weight:600;color:#fff;padding:2px}
.cell.empty{color:var(--mut)}
.cell small{display:block;font-weight:400;opacity:.9}
.fld{display:block;margin:10px 0}.fld span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.fld input,.fld select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);min-height:46px}
.fld.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}.fld.sw input{width:26px;height:26px;min-height:0}
.hint{font-size:12px;color:var(--mut);margin-top:3px}
.stat{display:flex;gap:10px;margin-bottom:10px}.stat .card{margin:0;text-align:center}.stat b{display:block;font-size:20px}
.photo{width:64px;height:64px;border-radius:10px;background:var(--chip);object-fit:cover;flex:none}
.money{font-weight:800;font-size:17px;white-space:nowrap}
table.kv{width:100%;border-collapse:collapse}table.kv td{padding:6px 0;border-bottom:1px solid var(--line)}table.kv td:last-child{text-align:right;font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;max-width:90%;display:none;text-align:center}
.login{max-width:420px;margin:0 auto;padding:40px 16px;text-align:center}
.login .btn{display:flex;width:100%;align-items:center;gap:12px;margin:8px 0;text-align:left}
a{color:var(--pri)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetHost"></div>
<div id="toast"></div>
<script>
var KP = (new URLSearchParams(location.search).get('k') || '').replace(/[^a-zA-Z0-9]/g, '');
var API_URL = "https://script.google.com/macros/s/AKfycbys0S7OgTXvjFp2M1Eoz5GUNz5Ypugk7iiTo0XCLyp22w5ZY3APDWwtT4cdyUv5fcXvUQ/exec"; // để trống khi chạy trong Apps Script; bản GitHub Pages được điền khi build (dev/build-pages.js)
(function () {
'use strict';
var app = document.getElementById('app');
var ACT = {};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function ssSet(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
var S = { boot: null, view: '', token: ssGet('tok') || '', user: null, tab: 'approve', sub: null, clockOff: 0, kioskToken: KP || lsGet('kioskToken') || '', pend: 0, seq: 0, month: '', pinState: null };
if (KP) lsSet('kioskToken', KP);

/* ---------- tiện ích ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { n = Math.round(n || 0); return (n < 0 ? '-' : '') + String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ'; }
function now() { return Date.now() + S.clockOff; }
function p2(n) { return (n < 10 ? '0' : '') + n; }
var OFF = 7 * 3600000;
function hm(ms) { return new Date(ms + OFF).toISOString().slice(11, 16); }
function ymd(ms) { return new Date(ms + OFF).toISOString().slice(0, 10); }
function addD(d, n) { var p = d.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10); }
var WD = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
function wd(d) { return WD[new Date(d + 'T00:00:00Z').getUTCDay()]; }
function dm(d) { return d.slice(8, 10) + '/' + d.slice(5, 7); }
function dur(min) { min = Math.round(min || 0); return Math.floor(min / 60) + 'g' + p2(min % 60); }
function ago(ms) { var m = Math.floor((now() - ms) / 60000); if (m < 1) return 'vừa xong'; if (m < 60) return m + ' phút trước'; return Math.floor(m / 60) + ' giờ trước'; }
function addM(m, n) { var p = m.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1 + n, 1)); return d.toISOString().slice(0, 7); }
function color(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return 'hsl(' + h + ',55%,42%)'; }
function av(name, id) { return '<div class="av" style="background:' + color(id || name) + '">' + esc((name || '?').trim().split(/\s+/).pop().charAt(0).toUpperCase()) + '</div>'; }
function toast(t) { var el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, 3200); }
var PAYL = { HOUR: 'Theo giờ', DAY: 'Theo ngày', SHIFT: 'Theo ca', MONTH: 'Theo tháng' };
var PAYU = { HOUR: '/giờ', DAY: '/ngày', SHIFT: '/ca', MONTH: '/tháng' };
var ADJL = { THUONG: 'Thưởng', PHUCAP: 'Phụ cấp', PHAT: 'Phạt', UNG: 'Ứng lương' };

// Hai chế độ: (1) chạy trong Apps Script → google.script.run; (2) chạy độc lập (GitHub Pages) → fetch tới API_URL.
function call(method, payload) {
  return new Promise(function (res, rej) {
    function done(r) {
      if (r && r.ok) return res(r.data);
      var e = new Error((r && r.error) || 'Lỗi không rõ'); e.code = r && r.code;
      if (e.code === 'AUTH' && S.view === 'mgr') { S.token = ''; ssSet('tok', null); toast(e.message); vLogin(); }
      rej(e);
    }
    function lost() { rej(new Error('Mất kết nối, thử lại')); }
    if (API_URL) {
      // text/plain để trình duyệt không cần gửi yêu cầu kiểm tra CORS trước (Apps Script không hỗ trợ OPTIONS)
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ method: method, payload: payload || {} }), redirect: 'follow' })
        .then(function (x) { return x.json(); }).then(done, lost);
      return;
    }
    google.script.run.withSuccessHandler(done).withFailureHandler(function (e) { rej(new Error((e && e.message) || 'Mất kết nối, thử lại')); }).rpc(method, payload || {});
  });
}
function api(method, payload) { payload = payload || {}; payload.token = S.token; return call(method, payload); }

/* ---------- sheet (hộp thoại) ---------- */
function openSheet(html, o) {
  var host = $('#sheetHost');
  host.innerHTML = '<div class="ov"><div class="sheet">' + html + '</div></div>';
  var ov = host.firstChild;
  ov.addEventListener('click', function (e) { if (e.target === ov && !(o && o.sticky)) closeSheet(); });
}
function closeSheet() { $('#sheetHost').innerHTML = ''; S.pinState = null; clearTimeout(S.doneT); }
function ask(text, okLabel, fn, danger) {
  openSheet('<h3>' + esc(text) + '</h3><div class="btns"><button class="btn ' + (danger ? 'no' : 'pri') + '" data-act="askOk">' + esc(okLabel) + '</button><button class="btn ghost" data-act="sheetClose">Huỷ</button></div>');
  S.askFn = fn;
}
ACT.askOk = function () { var f = S.askFn; closeSheet(); if (f) f(); };
ACT.sheetClose = function () { closeSheet(); };

/* ---------- bàn phím PIN ---------- */
function showPin(title, sub, onDone) {
  var k = '';
  for (var n = 1; n <= 9; n++) k += '<button data-act="key" data-k="' + n + '">' + n + '</button>';
  openSheet('<div class="pin"><h2>' + esc(title) + '</h2><p class="sub">' + esc(sub || '') + '</p><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><div class="perr" id="perr"></div><div class="keys">' + k +
    '<button class="ghost" data-act="sheetClose">Huỷ</button><button data-act="key" data-k="0">0</button><button class="ghost" data-act="key" data-k="x">⌫</button></div></div>');
  S.pinState = { val: '', busy: false, onDone: onDone };
}
function paintDots() { var d = document.querySelectorAll('#dots i'), v = S.pinState ? S.pinState.val.length : 0; for (var i = 0; i < d.length; i++) d[i].className = i < v ? 'on' : ''; }
ACT.key = function (el) {
  var p = S.pinState; if (!p || p.busy) return;
  var k = el.dataset.k;
  if (k === 'x') p.val = p.val.slice(0, -1); else if (p.val.length < 4) p.val += k;
  paintDots(); var pe = $('#perr'); if (pe) pe.textContent = '';
  if (p.val.length === 4) {
    p.busy = true;
    Promise.resolve().then(function () { return p.onDone(p.val); }).catch(function (e) {
      p.busy = false; p.val = ''; paintDots();
      var pe2 = $('#perr'); if (pe2) { pe2.textContent = e.message; var d = $('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
    });
  }
};
document.addEventListener('keydown', function (e) {
  if (!S.pinState) return;
  if (/^\d$/.test(e.key)) ACT.key({ dataset: { k: e.key } });
  else if (e.key === 'Backspace') ACT.key({ dataset: { k: 'x' } });
});

/* ---------- form chung ---------- */
function fieldHTML(f, v) {
  var l = esc(f.label), k = esc(f.k), h = f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '';
  if (f.type === 'switch') return '<label class="fld sw"><span>' + l + '</span><input type="checkbox" data-k="' + k + '"' + (v ? ' checked' : '') + '></label>' + h;
  if (f.type === 'select') {
    return '<label class="fld"><span>' + l + '</span><select data-k="' + k + '">' + f.options.map(function (o) {
      return '<option value="' + esc(o.v) + '"' + (String(o.v) === String(v) ? ' selected' : '') + '>' + esc(o.l) + '</option>';
    }).join('') + '</select></label>' + h;
  }
  var type = f.type === 'pin' ? 'tel' : (f.type || 'text'), extra = '';
  if (f.type === 'number') extra = ' inputmode="decimal" step="any"';
  if (f.type === 'pin') extra = ' inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off" placeholder="' + esc(f.ph || '4 chữ số') + '"';
  return '<label class="fld"><span>' + l + '</span><input type="' + type + '" data-k="' + k + '" value="' + esc(f.type === 'pin' ? '' : (v == null ? '' : v)) + '"' + extra + '></label>' + h;
}
function openForm(o) {
  var h = '<h2 style="margin-bottom:6px">' + esc(o.title) + '</h2>';
  o.fields.forEach(function (f) { h += fieldHTML(f, o.values && o.values[f.k]); });
  h += '<div class="btns"><button class="btn pri" data-act="formSave">' + (o.saveLabel || 'Lưu') + '</button>' + (o.onDelete ? '<button class="btn no" data-act="formDel">Xoá</button>' : '') + '<button class="btn ghost" data-act="sheetClose">Đóng</button></div>';
  S.form = o; openSheet(h, { sticky: true });
}
ACT.formSave = function (el) {
  var o = S.form, vals = {};
  o.fields.forEach(function (f) {
    var inp = $('#sheetHost [data-k="' + f.k + '"]'); if (!inp) return;
    vals[f.k] = f.type === 'switch' ? inp.checked : (f.type === 'number' ? (inp.value === '' ? 0 : Number(inp.value)) : inp.value);
  });
  el.disabled = true;
  Promise.resolve().then(function () { return o.onSave(vals); }).then(function () { closeSheet(); }).catch(function (e) { toast(e.message); el.disabled = false; });
};
ACT.formDel = function () { var o = S.form; ask('Xoá mục này? Không thể hoàn tác.', 'Xoá', function () { Promise.resolve(o.onDelete()).catch(function (e) { toast(e.message); }); }, true); };

/* ---------- đồng hồ + idle ---------- */
function startClock() {
  clearInterval(S.clockT);
  function tick() { var a = $('#clk'), b = $('#dt'); if (!a) return; var t = now(); a.textContent = hm(t); b.textContent = wd(ymd(t)) + ', ' + dm(ymd(t)) + '/' + ymd(t).slice(0, 4); }
  tick(); S.clockT = setInterval(tick, 5000);
}
function resetIdle() {
  clearTimeout(S.idleT);
  var ms = S.view === 'kiosk' ? 45000 : (S.view === 'mgr' && S.boot && S.boot.isKiosk ? 300000 : 0);
  if (ms) S.idleT = setTimeout(onIdle, ms);
}
function onIdle() { if (S.view === 'kiosk') { closeSheet(); loadKiosk(true); } else if (S.view === 'mgr') doLogout(); }
document.addEventListener('click', function (e) {
  resetIdle();
  var el = e.target.closest('[data-act]'); if (!el) return;
  var f = ACT[el.dataset.act]; if (f) { f(el, e); }
});
document.addEventListener('touchstart', resetIdle, { passive: true });

/* =====================================================================
 *  MÀN HÌNH CHẤM CÔNG (iPad)
 * ===================================================================== */
function vKiosk() {
  S.view = 'kiosk'; clearInterval(S.pollT); clearInterval(S.kioskT);
  app.innerHTML = '<div class="kiosk"><div class="khead"><h1>' + esc(S.boot.shopName) + '</h1><div class="clock"><b id="clk"></b><span id="dt"></span></div></div><div id="kbar"></div><div class="grid" id="grid"><div class="muted">Đang tải…</div></div><div class="kfoot"><button class="btn ghost" data-act="mgrLogin">🔒 Quản lý</button></div></div>';
  startClock(); loadKiosk(); resetIdle();
  S.kioskT = setInterval(function () { if (!$('#sheetHost').firstChild) loadKiosk(true); }, 30000);
}
function loadKiosk(quiet) {
  return call('kioskList', { deviceToken: S.kioskToken }).then(function (d) {
    S.clockOff = d.serverNow - Date.now(); S.kl = d;
    var bar = $('#kbar'); if (!bar) return;
    bar.innerHTML = d.requirePhoto ? '<div class="photobar">📷 Hôm nay chấm công cần chụp ảnh khuôn mặt</div>' : '';
    $('#grid').innerHTML = d.emps.length ? d.emps.map(function (e) {
      var st = e.state === 'IN' ? '<span class="st in">● Đang làm từ ' + hm(e.since) + '</span>' : '<span class="st">Chưa vào ca</span>';
      return '<button class="emp ' + (e.state === 'IN' ? 'in' : '') + '" data-act="pick" data-id="' + esc(e.id) + '">' + av(e.name, e.id) + '<b>' + esc(e.name) + '</b>' + st +
        (e.shifts.length ? '<small>Hôm nay: ' + esc(e.shifts.join(', ')) + '</small>' : '') + '</button>';
    }).join('') : '<div class="muted">Chưa có nhân viên. Quản lý hãy thêm nhân viên.</div>';
  }).catch(function (e) {
    if (e.code === 'NOKIOSK') { S.kioskToken = ''; lsSet('kioskToken', null); S.boot.isKiosk = false; return vLogin(); }
    if (!quiet) toast(e.message);
  });
}
ACT.pick = function (el) {
  var emp = (S.kl.emps.filter(function (e) { return e.id === el.dataset.id; })[0]);

function readPhoto(file) {
  return new Promise(function (res, rej) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var s = Math.min(1, 480 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);

    };

    img.src = url;

}

function badge() { var b = $('#bdg'); if (!b) return; b.style.display = S.pend ? 'inline-block' : 'none'; b.textContent = S.pend; document.title = (S.pend ? '(' + S.pend + ') ' : '') + 'Chấm công'; }

    if (d.items.length) h += '<div class="row" style="margin-bottom:8px"><b class="grow">' + d.items.length + ' yêu cầu chờ duyệt</b><button class="btn ok" data-act="approveAll">Duyệt tất cả</button></div>';

      else { if (it.earlyMin) chips += '<span class="chip warn">Về sớm ' + it.earlyMin + ' phút</span>'; if (it.otMin) chips += '<span class="chip ok">Tăng ca ' + it.otMin + ' phút</span>'; }

    onDelete: h ? function () { return api('holDelete', { date: h.date }).then(function () { closeSheet(); openSub('hols'); }); } : null
  });
}
ACT.holNew = function () { holForm(null); };
ACT.holEdit = function (el) { holForm(S.holAll.filter(function (x) { return x.date === el.dataset.date; })[0]); };

/* --- Cài đặt --- */
var SETF = [
  ['Chung', [['shopName', 'Tên cửa hàng', 'text']]],
  ['Đi trễ / về sớm', [['lateGrace', 'Cho phép đi trễ (phút) — trễ ít hơn thì không trừ', 'number'], ['earlyGrace', 'Cho phép về sớm (phút)', 'number'], ['lateFine', 'Phạt cố định mỗi lần đi trễ (đ, 0 = không phạt)', 'number'], ['earlyFine', 'Phạt cố định mỗi lần về sớm (đ)', 'number'], ['countEarly', 'Tính cả giờ đến sớm trước ca', 'switch']]],
  ['Tăng ca', [['otEnabled', 'Tính tăng ca', 'switch'], ['otAfter', 'Chỉ tính khi làm quá giờ ca từ (phút)', 'number'], ['otMult', 'Hệ số tăng ca (1.5 = 150%)', 'number']]],
  ['Tính lương', [['stdDays', 'Số ngày công chuẩn / tháng (lương tháng)', 'number'], ['stdHours', 'Số giờ / ngày công', 'number'], ['autoMatchShift', 'Chưa xếp lịch thì tự gán ca gần nhất (±2 giờ)', 'switch'], ['maxShiftHours', 'Ca mở quá bao nhiêu giờ thì coi là quên chốt', 'number']]],
  ['Ảnh', [['requirePhoto', 'Bắt buộc chụp ảnh khi chấm công (bật khi bạn không ở quán)', 'switch']]]
];
function sSettings(my) {
  subShell('Cài đặt', '', '<div class="muted c">Đang tải…</div>');
  api('settingsGet').then(function (d) {
    if (my !== S.seq) return; var st = d.settings, h = '';
    SETF.forEach(function (g) { h += '<div class="sec">' + g[0] + '</div><div class="card">' + g[1].map(function (f) { return fieldHTML({ k: f[0], label: f[1], type: f[2] }, st[f[0]]); }).join('') + '</div>'; });
    h += '<div class="btns"><button class="btn pri" data-act="saveSettings">Lưu cài đặt</button></div>';
    h += '<div class="sec">Máy chấm công (iPad ở quầy)</div><div class="card"><p class="muted" style="margin-top:0">Chỉ máy đã đăng ký mới hiện danh sách nhân viên để chấm công. Có ' + d.kioskCount + ' máy đã đăng ký.</p>' +
      '<button class="btn pri" style="width:100%;margin-bottom:8px" data-act="regKiosk">Dùng thiết bị này làm MÁY CHẤM CÔNG</button>' +
      (S.kioskToken ? '<button class="btn" style="width:100%;margin-bottom:8px" data-act="unregKiosk">Huỷ đăng ký thiết bị này</button>' : '') +
      '<button class="btn ghost" style="width:100%" data-act="clearKiosk">Huỷ tất cả máy chấm công</button></div>';
    h += '<div class="sec">Tài khoản của tôi</div><button class="btn" style="width:100%" data-act="chPin">Đổi PIN</button>';
    subShell('Cài đặt', '', h);
  }).catch(fail);
}
ACT.saveSettings = function (el) {
  var v = {}; SETF.forEach(function (g) { g[1].forEach(function (f) { var i = $('#body [data-k="' + f[0] + '"]'); if (i) v[f[0]] = f[2] === 'switch' ? i.checked : (f[2] === 'number' ? Number(i.value) : i.value); }); });
  el.disabled = true;
  api('settingsSet', { values: v }).then(function (r) { el.disabled = false; S.boot.shopName = r.settings.shopName; paintPhotoPill(r.settings.requirePhoto); toast('Đã lưu cài đặt'); }).catch(function (e) { el.disabled = false; toast(e.message); });
};
ACT.regKiosk = function (el) {
  var fromBanner = el && el.dataset && el.dataset.from === 'banner';
  api('registerKiosk').then(function (r) {
    S.kioskToken = r.deviceToken; lsSet('kioskToken', r.deviceToken); S.boot.isKiosk = true; S.boot.kioskCount = (S.boot.kioskCount || 0) + 1;
    if (API_URL) r.url = location.href.split('?')[0].split('#')[0] + '?k=' + r.deviceToken; // bản độc lập: link nằm trên chính trang này
    openSheet('<h3>✅ Đã đăng ký máy chấm công</h3><p>Thiết bị này giờ sẽ mở thẳng màn hình chấm công. Bấm "Thoát" để về màn hình nhân viên.</p>' +
      (r.url ? '<p class="muted">Muốn dùng iPad khác (hoặc iPad xoá dữ liệu trình duyệt): mở link riêng này trên iPad đó rồi "Thêm vào Màn hình chính". Link này là chìa khoá — đừng gửi cho nhân viên.</p><input readonly value="' + esc(r.url) + '" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)" onclick="this.select()">' : '') +
      '<div class="btns"><button class="btn pri" data-act="' + (fromBanner ? 'toKioskNow' : 'sheetClose') + '">' + (fromBanner ? 'Mở màn hình nhân viên' : 'Xong') + '</button></div>', { sticky: true });
    if (!fromBanner) openSub('settings');
  }).catch(function (e) { toast(e.message); });
};
ACT.unregKiosk = function () {
  api('unregisterKiosk', { deviceToken: S.kioskToken }).then(function () { S.kioskToken = ''; lsSet('kioskToken', null); S.boot.isKiosk = false; toast('Đã huỷ đăng ký thiết bị này'); openSub('settings'); }).catch(function (e) { toast(e.message); });
};
ACT.clearKiosk = function () {
  ask('Huỷ tất cả máy chấm công? Các iPad sẽ không chấm công được cho đến khi đăng ký lại.', 'Huỷ tất cả', function () {
    api('unregisterKiosk', { all: true }).then(function () { S.kioskToken = ''; lsSet('kioskToken', null); S.boot.isKiosk = false; toast('Đã huỷ tất cả'); openSub('settings'); }).catch(function (e) { toast(e.message); });
  }, true);
};
ACT.chPin = function () {
  openForm({ title: 'Đổi PIN', fields: [{ k: 'oldPin', label: 'PIN hiện tại', type: 'pin', ph: '' }, { k: 'newPin', label: 'PIN mới', type: 'pin', ph: '' }],
    onSave: function (v) { return api('changePin', v).then(function () { toast('Đã đổi PIN'); }); } });
};

/* =====================================================================
 *  KHỞI ĐỘNG
 * ===================================================================== */
function start() {
  app.innerHTML = '<div class="login"><p class="muted">Đang tải…</p></div>';
  call('boot', { deviceToken: S.kioskToken }).then(function (b) {
    S.boot = b; S.clockOff = b.serverNow - Date.now();
    if (S.kioskToken && !b.isKiosk) { S.kioskToken = ''; lsSet('kioskToken', null); }
    if (S.token && !b.isKiosk) { api('pendingCount').then(function () { vMgr(); }).catch(function () { vLogin(); }); return; }
    if (b.isKiosk) vKiosk(); else vLogin();
  }).catch(function (e) { app.innerHTML = '<div class="login"><h2>Không mở được ứng dụng</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Thử lại</button></div>'; });
}
start();
})();
</script>
</body>
</html>
