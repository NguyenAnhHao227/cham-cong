<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap&subset=vietnamese">
<style>
/* Bảng màu lấy theo khu nhân viên + Kho của web đặt món: nền xám nhạt, thẻ trắng, xanh dương làm điểm nhấn */
:root{color-scheme:light;--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--ink2:#334155;--mut:#64748b;--line:#e2e8f0;--pri:#0088ff;--pri2:#0070d6;--ok:#059669;--no:#e11d48;--warn:#b45309;--chip:#eef2f6;--okbg:#e6f7f0;--warnbg:#fff5dc;--nobg:#fff0f3;--shadow:0 1px 2px rgba(15,23,42,.05);--lift:0 8px 20px -10px rgba(0,136,255,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{text-wrap:balance}
.logo{width:56px;height:56px;border-radius:18px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
input[type=checkbox]{accent-color:var(--pri)}
.muted{color:var(--mut)}.c{text-align:center}.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:13px 15px;margin:0 0 10px;display:block;width:100%;text-align:left;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:600;min-height:48px;box-shadow:var(--shadow)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:var(--lift)}
.btn.pri:active{background:var(--pri2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no{background:var(--no);border-color:var(--no);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;margin-top:10px}.btns .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips:empty{display:none}
.go{color:var(--mut);font-size:20px;line-height:1;flex:none;margin-left:2px}.subtip{margin:-4px 2px 10px;font-size:13px;color:var(--mut)}
.erow{display:flex;align-items:center;gap:10px;padding:14px 12px}.erow .etxt{flex:1;min-width:0}.erow .etxt .chips{margin-top:6px;gap:4px}.erow .chip{font-size:12px;padding:2px 8px;white-space:nowrap}.erow .btn{flex:none;padding:12px 14px}
@media(min-width:420px){.erow{gap:12px;padding:14px 15px}.erow .btn{padding:12px 18px}.erow .chip{font-size:13px;padding:2px 10px}}
.chip{background:var(--chip);color:var(--ink2);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.no{background:var(--nobg);color:var(--no)}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;flex:none}
h1,h2,h3{margin:0}
/* kiosk: thanh đầu trắng như header khu nhân viên */
.kiosk{min-height:100vh;display:flex;flex-direction:column}
.kban{background:#fff;border-bottom:1px solid var(--line);padding:12px max(16px,calc((100% - 1100px)/2 + 16px));display:flex;align-items:center;gap:12px}
.kban .logo{width:44px;height:44px;font-size:22px;border-radius:14px}
.kban .ktxt{min-width:0;flex:1}
.kban h1{font-size:19px;line-height:1.2;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi{margin-top:2px;font-size:13px;font-weight:600;color:var(--mut)}
.clock{text-align:right;flex:none}.clock b{font-size:30px;display:block;line-height:1;color:var(--pri);font-variant-numeric:tabular-nums}.clock span{color:var(--mut);font-size:12px}
.kmain{width:100%;max-width:1100px;margin:0 auto;padding:16px 16px 28px;flex:1;display:flex;flex-direction:column;gap:14px}
.kgrid{display:grid;grid-template-columns:1fr;gap:14px;align-content:stretch;flex:1}
@media(min-width:760px) and (orientation:landscape){.kgrid{grid-template-columns:1.05fr 1fr;align-items:stretch}}
.qrcard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
#qrBox{width:min(100%,520px,58vh);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
#qrBox svg{display:block;width:100%;height:100%;border-radius:12px}
.qrbar{width:min(100%,520px,58vh);height:8px;border-radius:99px;background:var(--chip);overflow:hidden}.qrbar i{display:block;height:100%;width:100%;background:var(--pri)}
.qrtip{margin:0;color:var(--mut);font-size:14px}
@media(min-width:1000px){
.kban{padding-top:16px;padding-bottom:16px;gap:16px}
.kban .logo{width:56px;height:56px;font-size:28px;border-radius:18px}
.kban h1{font-size:26px}.hi{font-size:15px}
.clock b{font-size:42px}.clock span{font-size:14px}
}
/* hướng dẫn dạng infographic */
.steps{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px 18px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;justify-content:center;margin:0 0 14px}
.kgrid .steps{margin:0}
.steps h2{font-size:18px;margin-bottom:12px}
.stl{display:flex;flex-direction:column;gap:18px}
.step{display:flex;gap:14px;position:relative;align-items:center}
.step:not(:last-child):before{content:"";position:absolute;left:21px;top:46px;bottom:-16px;width:2px;background:var(--line)}
.sn{width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:22px;flex:none;box-shadow:var(--lift)}
.step b{display:block;font-size:16px;line-height:1.3}.step .d{display:block;color:var(--mut);font-size:14px}
/* iPad / màn rộng: chữ và biểu tượng lớn hơn, dàn đều cho vừa khung */
@media(min-width:700px){
.steps{padding:26px 30px}.steps h2{font-size:28px;margin-bottom:24px}
.stl{gap:34px}.step{gap:20px}
.sn{width:68px;height:68px;font-size:34px}
.step:not(:last-child):before{left:33px;top:72px;bottom:-32px}
.step b{font-size:23px}.step .d{font-size:18px;margin-top:2px}
}
.kcta{display:flex;justify-content:center}.kcta .btn{min-width:min(100%,360px);font-size:19px;min-height:60px;justify-content:center}
.staffcta{background:linear-gradient(180deg,#1aa0ff,#0070d6);color:#fff;border-radius:24px;padding:18px;text-align:center;box-shadow:var(--lift);margin:0 0 14px}
.staffcta h2{font-size:22px}.staffcta p{margin:4px 0 14px;opacity:.92}
.staffcta .btn{background:#fff;color:var(--pri2);border-color:#fff;width:100%;font-size:18px;font-weight:800;min-height:56px;box-shadow:none}
/* màn hình nhân viên + quét */
.shome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;gap:14px}
.hello{font-size:20px;font-weight:700}
.punchbtn{width:min(300px,78vw,60vh);aspect-ratio:1;border-radius:50%;border:0;background:linear-gradient(180deg,#1aa0ff,#0070d6);color:#fff;font-size:34px;font-weight:800;box-shadow:0 22px 40px -18px rgba(0,136,255,.9)}
.punchbtn:active{transform:scale(.97)}
.scan{position:fixed;inset:0;background:#000;z-index:60}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .top2{position:absolute;left:0;right:0;top:0;padding:14px 16px;display:flex;gap:10px;align-items:center}
.scan .frame{position:absolute;left:50%;top:50%;width:min(62vw,62vh,340px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:24px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
.scan .msg{position:absolute;left:16px;right:16px;bottom:22px;color:#fff;text-align:center;font-weight:600;text-shadow:0 1px 4px #000;z-index:2}
.scan .msg .btn{color:var(--ink)}
/* hộp lưu ý khi tin tưởng máy */
.notes{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.notes li{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.35}
.notes .ni{font-size:22px;line-height:1.2;flex:none}
.ack{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px;font-weight:700;margin:12px 0 2px}
.ack i{width:32px;height:32px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;flex:none;color:transparent;font-style:normal;font-size:18px;font-weight:800}
.ack.on{border-color:var(--ok)}.ack.on i{background:var(--ok);border-color:var(--ok);color:#fff}
.kfoot{margin-top:6px;text-align:center}
.kfoot .btn{border:0;background:none;box-shadow:none;min-height:44px;padding:10px 16px;font-size:12px;font-weight:500;color:var(--mut);opacity:.55}
.kfoot .btn:active{opacity:1}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:12px 18px 26px;box-shadow:0 -6px 30px rgba(15,23,42,.2);position:relative}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#cbd5e1;margin:0 auto 14px}

/* xoay ngang trên điện thoại (màn thấp): PIN chia hai cột, tên + chấm bên trái, bàn phím bên phải */
@media(max-height:520px){
  .ov{align-items:center}.sheet{max-height:96vh;border-radius:22px;padding:8px 16px 14px}.sheet:before{margin-bottom:6px}
  .sheet.pinsheet{max-width:620px}
  .pinsheet .pin{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto 1fr;column-gap:20px;align-items:start}
  .pinsheet .pin>*{grid-column:1}.pinsheet .pin .keys{grid-column:2;grid-row:1/span 4;max-width:none;margin:0;gap:8px}
  .pinsheet .pin h2{font-size:20px;margin-top:18px}.pinsheet .keys button{height:46px;font-size:22px;border-radius:14px}
  .big{min-height:64px;font-size:24px;margin:6px 0}
  .done .tick{font-size:48px}
}
.pin{text-align:center}.pin h2{font-size:22px}.pin .sub{margin:2px 0 10px;color:var(--mut)}
.dots{display:flex;gap:14px;justify-content:center;margin:10px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--mut)}.dots i.on{background:var(--pri);border-color:var(--pri)}
.perr{min-height:22px;color:var(--no);font-weight:600}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:6px auto 0}
.keys button{height:68px;font-size:26px;font-weight:600;border-radius:20px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}

.big{width:100%;min-height:92px;font-size:28px;border-radius:24px;border:0;font-weight:800;color:#fff;margin:10px 0;box-shadow:0 8px 20px -10px rgba(15,23,42,.5)}

.mgr{min-height:100vh;padding:0 0 110px}
#body{max-width:900px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);margin:0 0 12px;min-height:64px;padding:0 max(14px,calc((100% - 900px)/2 + 14px));display:flex;align-items:center;gap:8px}

.money{font-weight:800;font-size:17px;white-space:nowrap}

a{color:var(--pri)}

<body>
<div id="app"></div>
<div id="sheetHost"></div>
<div id="toast"></div>
<script>
var KP = (new URLSearchParams(location.search).get('k') || '').replace(/[^a-zA-Z0-9]/g, '');
var API_URL = "https://script.google.com/macros/s/AKfycbys0S7OgTXvjFp2M1Eoz5GUNz5Ypugk7iiTo0XCLyp22w5ZY3APDWwtT4cdyUv5fcXvUQ/exec"; // để trống khi chạy trong Apps Script; bản GitHub Pages được điền khi build (dev/build-pages.js)
(function () {
'use strict';
var app = document.getElementById('app');
var ACT = {};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function ssSet(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
var S = { boot: null, view: '', token: ssGet('tok') || '', user: null, tab: 'approve', sub: null, clockOff: 0, kioskToken: KP || lsGet('kioskToken') || '', pend: 0, seq: 0, month: '', pinState: null };

/* Cài thành ứng dụng (PWA) — chỉ bản GitHub Pages. iPad/iPhone dùng "Thêm vào MH chính" của Safari và KHÔNG gắn manifest,

var IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var INSTALLED = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
var installEvt = null;
if (API_URL && !IOS && 'serviceWorker' in navigator && location.protocol === 'https:') {
  var mf = document.createElement('link'); mf.rel = 'manifest'; mf.href = 'manifest.webmanifest'; document.head.appendChild(mf);
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; });

/* ---------- tiện ích ---------- */
function $(s, r) { return (r || document).querySelector(s); }

function now() { return Date.now() + S.clockOff; }
function p2(n) { return (n < 10 ? '0' : '') + n; }
var OFF = 7 * 3600000;
function hm(ms) { return new Date(ms + OFF).toISOString().slice(11, 16); }
function ymd(ms) { return new Date(ms + OFF).toISOString().slice(0, 10); }
function addD(d, n) { var p = d.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10); }
var WD = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
function wd(d) { return WD[new Date(d + 'T00:00:00Z').getUTCDay()]; }
function dm(d) { return d.slice(8, 10) + '/' + d.slice(5, 7); }
function dur(min) { min = Math.round(min || 0); return Math.floor(min / 60) + 'g' + p2(min % 60); }
function ago(ms) { var m = Math.floor((now() - ms) / 60000); if (m < 1) return 'vừa xong'; if (m < 60) return m + ' phút trước'; if (m < 2880) return Math.floor(m / 60) + ' giờ trước'; return Math.floor(m / 1440) + ' ngày trước'; }
function addM(m, n) { var p = m.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1 + n, 1)); return d.toISOString().slice(0, 7); }

var PAYL = { HOUR: 'Theo giờ', DAY: 'Theo ngày', SHIFT: 'Theo ca', MONTH: 'Theo tháng' };
var PAYU = { HOUR: '/giờ', DAY: '/ngày', SHIFT: '/ca', MONTH: '/tháng' };
var ADJL = { THUONG: 'Thưởng', PHUCAP: 'Phụ cấp', PHAT: 'Phạt', UNG: 'Ứng lương' };

// Hai chế độ: (1) chạy trong Apps Script → google.script.run; (2) chạy độc lập (GitHub Pages) → fetch tới API_URL.
function call(method, payload) {
  return new Promise(function (res, rej) {
    function done(r) {
      if (r && r.ok) return res(r.data);

      if (e.code === 'AUTH' && S.view === 'mgr') { S.token = ''; ssSet('tok', null); toast(e.message); vLogin(); }
      rej(e);
    }
    function lost() { rej(new Error('Mất kết nối, thử lại')); }
    if (API_URL) {
      // text/plain để trình duyệt không cần gửi yêu cầu kiểm tra CORS trước (Apps Script không hỗ trợ OPTIONS)

  });

function api(method, payload) { payload = payload || {}; payload.token = S.token; return call(method, payload); }

/* ---------- sheet (hộp thoại) ---------- */
function openSheet(html, o) {
  var host = $('#sheetHost');
  host.innerHTML = '<div class="ov"><div class="sheet' + (o && o.cls ? ' ' + o.cls : '') + '">' + html + '</div></div>';
  var ov = host.firstChild;
  ov.addEventListener('click', function (e) { if (e.target === ov && !(o && o.sticky)) closeSheet(); });
}
function closeSheet() { $('#sheetHost').innerHTML = ''; S.pinState = null; clearTimeout(S.doneT); }
function ask(text, okLabel, fn, danger) {
  openSheet('<h3>' + esc(text) + '</h3><div class="btns"><button class="btn ' + (danger ? 'no' : 'pri') + '" data-act="askOk">' + esc(okLabel) + '</button><button class="btn ghost" data-act="sheetClose">Huỷ</button></div>');
  S.askFn = fn;
}
ACT.askOk = function () { var f = S.askFn; closeSheet(); if (f) f(); };
ACT.sheetClose = function () { closeSheet(); };

/* ---------- bàn phím PIN ---------- */
function showPin(title, sub, onDone) {
  var k = '';
  for (var n = 1; n <= 9; n++) k += '<button data-act="key" data-k="' + n + '">' + n + '</button>';
  openSheet('<div class="pin"><h2>' + esc(title) + '</h2>' + (sub ? '<p class="sub">' + esc(sub) + '</p>' : '') + '<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><div class="perr" id="perr"></div><div class="keys">' + k +
    '<button class="ghost" data-act="sheetClose">Huỷ</button><button data-act="key" data-k="0">0</button><button class="ghost" data-act="key" data-k="x">⌫</button></div></div>', { cls: 'pinsheet' });
  S.pinState = { val: '', busy: false, onDone: onDone };
}
function paintDots() { var d = document.querySelectorAll('#dots i'), v = S.pinState ? S.pinState.val.length : 0; for (var i = 0; i < d.length; i++) d[i].className = i < v ? 'on' : ''; }
ACT.key = function (el) {
  var p = S.pinState; if (!p || p.busy) return;
  var k = el.dataset.k;
  if (k === 'x') p.val = p.val.slice(0, -1); else if (p.val.length < 4) p.val += k;
  paintDots(); var pe = $('#perr'); if (pe) pe.textContent = '';
  if (p.val.length === 4) {
    p.busy = true;
    Promise.resolve().then(function () { return p.onDone(p.val); }).catch(function (e) {
      p.busy = false; p.val = ''; paintDots();
      var pe2 = $('#perr'); if (pe2) { pe2.textContent = e.message; var d = $('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
    });
  }
};
document.addEventListener('keydown', function (e) {
  if (!S.pinState) return;
  if (/^\d$/.test(e.key)) ACT.key({ dataset: { k: e.key } });
  else if (e.key === 'Backspace') ACT.key({ dataset: { k: 'x' } });
});

/* ---------- form chung ---------- */
function fieldHTML(f, v) {
  if (f.type === 'html') return f.html;
  var l = esc(f.label), k = esc(f.k), h = f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '';
  if (f.type === 'switch') return '<label class="fld sw"><span>' + l + '</span><input type="checkbox" data-k="' + k + '"' + (v ? ' checked' : '') + '></label>' + h;
  if (f.type === 'select') {
    return '<label class="fld"><span>' + l + '</span><select data-k="' + k + '">' + f.options.map(function (o) {
      return '<option value="' + esc(o.v) + '"' + (String(o.v) === String(v) ? ' selected' : '') + '>' + esc(o.l) + '</option>';
    }).join('') + '</select></label>' + h;
  }
  var type = f.type === 'pin' ? 'tel' : (f.type || 'text'), extra = '';
  if (f.type === 'number') extra = ' inputmode="decimal" step="any"';
  if (f.type === 'pin') extra = ' inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off" placeholder="' + esc(f.ph || '4 chữ số') + '"';
  return '<label class="fld"><span>' + l + '</span><input type="' + type + '" data-k="' + k + '" value="' + esc(f.type === 'pin' ? '' : (v == null ? '' : v)) + '"' + extra + '></label>' + h;
}
function openForm(o) {
  var h = '<h2 style="margin-bottom:6px">' + esc(o.title) + '</h2>';
  o.fields.forEach(function (f) { h += fieldHTML(f, o.values && o.values[f.k]); });
  h += '<div class="btns"><button class="btn pri" data-act="formSave">' + (o.saveLabel || 'Lưu') + '</button>' + (o.onDelete ? '<button class="btn no" data-act="formDel">Xoá</button>' : '') + '<button class="btn ghost" data-act="sheetClose">Đóng</button></div>';
  S.form = o; openSheet(h, { sticky: true });
}
ACT.formSave = function (el) {
  var o = S.form, vals = {};
  o.fields.forEach(function (f) {
    var inp = $('#sheetHost [data-k="' + f.k + '"]'); if (!inp) return;
    vals[f.k] = f.type === 'switch' ? inp.checked : (f.type === 'number' ? (inp.value === '' ? 0 : Number(inp.value)) : inp.value);
  });
  el.disabled = true;
  Promise.resolve().then(function () { return o.onSave(vals); }).then(function () { closeSheet(); }).catch(function (e) { toast(e.message); el.disabled = false; });
};
ACT.formDel = function () { var o = S.form; ask('Xoá mục này? Không thể hoàn tác.', 'Xoá', function () { Promise.resolve(o.onDelete()).catch(function (e) { toast(e.message); }); }, true); };

/* ---------- đồng hồ + idle ---------- */
function startClock() {
  clearInterval(S.clockT);
  function tick() { var a = $('#clk'), b = $('#dt'); if (!a) return; var t = now(), hi = $('#hi'); if (hi) hi.textContent = greet(); a.textContent = hm(t); b.textContent = wd(ymd(t)) + ', ' + dm(ymd(t)) + '/' + ymd(t).slice(0, 4); }
  tick(); S.clockT = setInterval(tick, 5000);
}
function logoCh() { var n = String((S.boot && S.boot.shopName) || '').trim(); return n ? n.charAt(0).toUpperCase() : '⏱'; }
function greet() {
  var h = parseInt(hm(now()).split(':')[0], 10);
  return (h < 11 ? '☀️ Chào buổi sáng' : h < 14 ? '🌤️ Chào buổi trưa' : h < 18 ? '🌇 Chào buổi chiều' : '🌙 Chào buổi tối') + '!';

  clearTimeout(S.idleT);
  if (S.view === 'mgr' && S.boot && S.boot.isKiosk) S.idleT = setTimeout(onIdle, 300000); // quản lý quên đăng xuất trên iPad
}
function onIdle() { if (S.view === 'mgr') doLogout(); }
document.addEventListener('click', function (e) {
  resetIdle();
  var el = e.target.closest('[data-act]'); if (!el) return;
  var f = ACT[el.dataset.act]; if (f) { f(el, e); }

document.addEventListener('touchstart', resetIdle, { passive: true });

/* ---------- thư viện ngoài (chỉ tải khi cần) ---------- */
var LIBS = {
  qr: ['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'],
  jsqr: ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', 'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js']

function loadLib(name) {
  S.libs = S.libs || {};
  if (S.libs[name]) return S.libs[name];
  var urls = LIBS[name].slice();
  S.libs[name] = new Promise(function (res, rej) {
    (function next() {
      var u = urls.shift();
      if (!u) { S.libs[name] = null; return rej(new Error('Không tải được thư viện. Kiểm tra mạng rồi thử lại.')); }
      var s = document.createElement('script'); s.src = u; s.async = true;
      s.onload = function () { res(); };
      s.onerror = function () { s.remove(); next(); };
      document.head.appendChild(s);
    })();
  });
  return S.libs[name];

/* Mã QR = CC.<chu kỳ>.<12 ký tự đầu của HMAC-SHA256(khoá bí mật, chu kỳ)> — iPad tự tính, không gọi mạng mỗi vài giây. */

  return '<svg viewBox="0 0 ' + s + ' ' + s + '" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mã QR chấm công"><rect width="' + s + '" height="' + s + '" fill="#fff"/><path d="' + d + '" fill="#0f172a"/></svg>';
}

  });
}

      '<button class="btn pri" style="width:100%;margin-bottom:8px" data-act="regKiosk">Dùng thiết bị này làm MÁY CHẤM CÔNG</button>' +
      (S.kioskToken ? '<button class="btn" style="width:100%;margin-bottom:8px" data-act="unregKiosk">Huỷ đăng ký thiết bị này</button>' : '') +
      '<button class="btn ghost" style="width:100%" data-act="clearKiosk">Huỷ tất cả máy chấm công</button></div>';
    h += '<div class="sec">Tài khoản của tôi</div><button class="btn" style="width:100%" data-act="chPin">Đổi PIN</button>';
    subShell('Cài đặt', '', h);
  }).catch(fail);
}
ACT.installApp = function () {
  if (!installEvt) return;
  installEvt.prompt();
  installEvt.userChoice.then(function () { installEvt = null; if (S.sub === 'settings') openSub('settings'); });
};
ACT.saveSettings = function (el) {
  var v = {}; SETF.forEach(function (g) { g[1].forEach(function (f) { var i = $('#body [data-k="' + f[0] + '"]'); if (i) v[f[0]] = f[2] === 'switch' ? i.checked : (f[2] === 'number' ? Number(i.value) : i.value); }); });
  el.disabled = true;
  api('settingsSet', { values: v }).then(function (r) { el.disabled = false; S.boot.shopName = r.settings.shopName; toast('Đã lưu cài đặt'); }).catch(function (e) { el.disabled = false; toast(e.message); });
};
ACT.regKiosk = function (el) {
  var fromBanner = el && el.dataset && el.dataset.from === 'banner';
  api('registerKiosk').then(function (r) {
    S.kioskToken = r.deviceToken; lsSet('kioskToken', r.deviceToken); S.boot.isKiosk = true; S.boot.kioskCount = (S.boot.kioskCount || 0) + 1;
    if (API_URL) r.url = location.href.split('?')[0].split('#')[0] + '?k=' + r.deviceToken; // bản độc lập: link nằm trên chính trang này
    openSheet('<h3>✅ Đã đăng ký máy chấm công</h3><p>Thiết bị này giờ sẽ mở thẳng màn hình chấm công. Bấm "Thoát" để về màn hình nhân viên.</p>' +
      (r.url ? '<p class="muted">Muốn dùng iPad khác (hoặc iPad xoá dữ liệu trình duyệt): mở link riêng này trên iPad đó rồi "Thêm vào Màn hình chính". Link này là chìa khoá — đừng gửi cho nhân viên.</p><input readonly value="' + esc(r.url) + '" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)" onclick="this.select()">' : '') +
      '<div class="btns"><button class="btn pri" data-act="' + (fromBanner ? 'toKioskNow' : 'sheetClose') + '">' + (fromBanner ? 'Mở màn hình nhân viên' : 'Xong') + '</button></div>', { sticky: true });
    if (!fromBanner) openSub('settings');
  }).catch(function (e) { toast(e.message); });
};
ACT.unregKiosk = function () {
  api('unregisterKiosk', { deviceToken: S.kioskToken }).then(function () { S.kioskToken = ''; lsSet('kioskToken', null); S.boot.isKiosk = false; toast('Đã huỷ đăng ký thiết bị này'); openSub('settings'); }).catch(function (e) { toast(e.message); });
};
ACT.clearKiosk = function () {
  ask('Huỷ tất cả máy chấm công? Các iPad sẽ không chấm công được cho đến khi đăng ký lại.', 'Huỷ tất cả', function () {
    api('unregisterKiosk', { all: true }).then(function () { S.kioskToken = ''; lsSet('kioskToken', null); S.boot.isKiosk = false; toast('Đã huỷ tất cả'); openSub('settings'); }).catch(function (e) { toast(e.message); });
  }, true);
};
ACT.chPin = function () {
  openForm({ title: 'Đổi PIN', fields: [{ k: 'oldPin', label: 'PIN hiện tại', type: 'pin', ph: '' }, { k: 'newPin', label: 'PIN mới', type: 'pin', ph: '' }],
    onSave: function (v) { return api('changePin', v).then(function () { toast('Đã đổi PIN'); }); } });
};

/* =====================================================================
 *  KHỞI ĐỘNG
 * ===================================================================== */
function start() {
  app.innerHTML = '<div class="login"><p class="muted">Đang tải…</p></div>';
  call('boot', { deviceToken: S.kioskToken }).then(function (b) {
    S.boot = b; S.clockOff = b.serverNow - Date.now();
    if (S.kioskToken && !b.isKiosk) { S.kioskToken = ''; lsSet('kioskToken', null); }
    if (S.token && !b.isKiosk) { api('pendingCount').then(function () { vMgr(); }).catch(function () { vHome(); }); return; }
    vHome();
  }).catch(function (e) { app.innerHTML = '<div class="login"><h2>Không mở được ứng dụng</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Thử lại</button></div>'; });
}
start();
})();
</script>
</body>
</html>
